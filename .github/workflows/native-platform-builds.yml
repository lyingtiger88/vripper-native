name: Native platform builds

on:
  workflow_dispatch:
  push:
    branches:
      - migration/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x86-64 smoke build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        working-directory: apps/client
        run: flutter create --platforms=windows --org com.vripper .
      - name: Build native Rust engine
        run: cargo build --release -p vripper-core --target x86_64-pc-windows-msvc
      - name: Build Flutter desktop application
        working-directory: apps/client
        run: flutter build windows --release
      - name: Bundle native engine beside executable
        shell: pwsh
        run: |
          $release = "apps/client/build/windows/x64/runner/Release"
          Copy-Item "target/x86_64-pc-windows-msvc/release/vripper_core.dll" "$release/vripper_core.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: vripper-native-windows-x64
          path: apps/client/build/windows/x64/runner/Release/
          if-no-files-found: error

  android-arm64:
    name: Android ARM64 smoke build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android command-line tools and NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-35" "platforms;android-36" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Configure Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Generate Android runner
        working-directory: apps/client
        run: flutter create --platforms=android --org com.vripper .
      - name: Set Android compile SDK required by Flutter plugins
        working-directory: apps/client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              path.write_text(text)
              print(f"Configured compile SDK 36 in {path}")
          PY
      - name: Build native Rust engine for ARM64
        run: cargo ndk -t arm64-v8a -o apps/client/android/app/src/main/jniLibs build --release -p vripper-core
      - name: Align file picker library compile SDK
        working-directory: apps/client
        run: |
          flutter pub get
          python3 - <<'PY'
          import json, pathlib, re, urllib.parse
          config = pathlib.Path(".dart_tool/package_config.json").resolve()
          packages = json.loads(config.read_text())["packages"]
          picker = next(p for p in packages if p["name"] == "file_picker")
          uri = urllib.parse.urlparse(urllib.parse.urljoin(config.as_uri(), picker["rootUri"]))
          root = pathlib.Path(urllib.parse.unquote(uri.path))
          for path in (root / "android").glob("build.gradle*"):
              original = path.read_text()
              updated = re.sub(r'(compileSdk(?:Version)?\s*(?:=\s*)?)34\b', r'\g<1>36', original)
              if updated != original:
                  path.write_text(updated)
                  print("Aligned file_picker compile SDK")
          PY
      - name: Build Android APK
        working-directory: apps/client
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vripper-native-android-arm64
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux-x64:
    name: Linux x86-64 smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - name: Generate Linux runner
        working-directory: apps/client
        run: flutter create --platforms=linux --org com.vripper .
      - name: Build native engine
        run: cargo build --release -p vripper-core --target x86_64-unknown-linux-gnu
      - name: Build desktop application
        working-directory: apps/client
        run: flutter build linux --release
      - name: Bundle native engine
        run: cp target/x86_64-unknown-linux-gnu/release/libvripper_core.so apps/client/build/linux/x64/release/bundle/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: vripper-native-linux-x64
          path: apps/client/build/linux/x64/release/bundle/
          if-no-files-found: error
