[workspace]
resolver = "2"
members = ["engine/vripper-core"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
regex = "1.11"
thiserror = "2.0"
scraper = "0.22"
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream"] }
url = "2.5"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"
tempfile = "3.15"
md-5 = "0.10"
